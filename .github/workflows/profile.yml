name: profile-art

on:
  schedule:
    - cron: "0 0 * * *" # 04:00 Dubai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0a0a0a&color_dots=#5aa8aa,#3f8385,#2b6163,#1a4142,#0c2627

      - name: Paint the teal background
        run: |
          python3 - <<'EOF'
          import pathlib, re
          p = pathlib.Path("dist/snake.svg")
          s = p.read_text()
          x, y, w, h = re.search(r'viewBox="([-\d.]+) ([-\d.]+) ([-\d.]+) ([-\d.]+)"', s).groups()
          rect = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="18" fill="#66bcbe"/>'
          p.write_text(re.sub(r"(<svg[^>]*>)", lambda m: m.group(1) + rect, s, count=1))
          EOF

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fonttools

      - name: Render stats cards
        run: python .github/scripts/render_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/generated
          if git commit -m "chore: refresh stats cards"; then
            git pull --rebase
            git push
          fi
