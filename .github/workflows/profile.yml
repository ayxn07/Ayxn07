name: profile-art

on:
  schedule:
    - cron: "0 0 * * *" # 04:00 Dubai
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#ff2a6d&color_dots=#1b0b3a,#4c1d95,#7700ff,#d300c5,#66bcbe
            dist/snake-light.svg?color_snake=#d300c5&color_dots=#ebedf0,#c4b5fd,#a78bfa,#7c3aed,#3f8f91

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contrib-3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          if git commit -m "chore: refresh 3d contribution calendar"; then
            git pull --rebase
            git push
          fi
