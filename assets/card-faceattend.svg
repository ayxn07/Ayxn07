<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="FACEATTEND">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14042e"/><stop offset="1" stop-color="#0d0221"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2a6d"/><stop offset=".5" stop-color="#7700ff"/><stop offset="1" stop-color="#66bcbe"/></linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7700ff" stroke-opacity=".14"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="card"><rect x="1.5" y="1.5" width="417" height="257" rx="14"/></clipPath>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
  .disp{font-family:'Orbitron','Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  @keyframes run{to{stroke-dashoffset:-1300}}
  .run{animation:run 5s linear infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .nudge{animation:nudge 1.4s ease-in-out infinite}
  
  @keyframes scan{0%,100%{transform:translateY(4px)}50%{transform:translateY(58px)}}
  .scanline{animation:scan 2.4s ease-in-out infinite}

  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)"><rect width="420" height="260" fill="url(#bg)"/><rect width="420" height="260" fill="url(#grid)"/></g>
<rect x="1.5" y="1.5" width="417" height="257" rx="14" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5"/>
<rect class="run" x="1.5" y="1.5" width="417" height="257" rx="14" fill="none" stroke="#d300c5" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 1210" filter="url(#glow)"/>

<text class="mono" x="24" y="34" font-size="11" letter-spacing="2" fill="#8b7fb8">PROJECT_03</text>
<g transform="translate(324 20)">
  <rect width="72" height="20" rx="10" fill="#f9f002" fill-opacity=".12" stroke="#f9f002" stroke-opacity=".6"/>
  <circle class="pulse" cx="11" cy="10" r="3.5" fill="#f9f002"/>
  <text class="mono" x="21" y="14" font-size="10.5" letter-spacing="1" fill="#f9f002">PYTHON</text>
</g>

<text class="disp" x="24" y="86" font-size="30" letter-spacing="2" fill="#d300c5" opacity=".6" filter="url(#blur)">FACEATTEND</text>
<text class="disp" x="24" y="86" font-size="30" letter-spacing="2" fill="#fff">FACEATTEND</text>
<rect x="24" y="98" width="44" height="3" rx="1.5" fill="#d300c5"/><rect x="72" y="98" width="10" height="3" rx="1.5" fill="#66bcbe"/>

<text class="mono" x="24" y="128" font-size="13" fill="#e0d7ff">Touchless attendance system - computer</text><text class="mono" x="24" y="148" font-size="13" fill="#e0d7ff">vision detects &amp; identifies faces over</text><text class="mono" x="24" y="168" font-size="13" fill="#e0d7ff">webcam and logs every timestamp.</text>
<g transform="translate(24 190)"><rect width="58" height="22" rx="5" fill="#d300c5" fill-opacity=".1" stroke="#d300c5" stroke-opacity=".55"/><text class="mono" x="29.0" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">Python</text></g><g transform="translate(90 190)"><rect width="120" height="22" rx="5" fill="#d300c5" fill-opacity=".1" stroke="#d300c5" stroke-opacity=".55"/><text class="mono" x="60.0" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">Computer Vision</text></g><g transform="translate(218 190)"><rect width="106" height="22" rx="5" fill="#d300c5" fill-opacity=".1" stroke="#d300c5" stroke-opacity=".55"/><text class="mono" x="53.0" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">CustomTkinter</text></g>
<g class="nudge"><text class="mono" x="24" y="240" font-size="12" fill="#66bcbe">&gt;&gt; github.com/ayxn07/FaceAttend-System</text></g>

<g transform="translate(340 52) scale(.85)">
  <path d="M0 14V0H14M50 0H64V14M0 50V64H14M50 64H64V50" fill="none" stroke="#66bcbe" stroke-width="2"/>
  <circle cx="32" cy="30" r="15" fill="none" stroke="#e0d7ff" stroke-width="1.6"/>
  <circle cx="26.5" cy="27" r="1.8" fill="#e0d7ff"/><circle cx="37.5" cy="27" r="1.8" fill="#e0d7ff"/>
  <path d="M26 35Q32 40 38 35" fill="none" stroke="#e0d7ff" stroke-width="1.6"/>
  <path d="M17 52Q32 42 47 52" fill="none" stroke="#e0d7ff" stroke-width="1.6"/>
  <rect class="scanline" x="4" y="0" width="56" height="2" fill="#00ff9f" filter="url(#glow)"/>
</g>
</svg>
