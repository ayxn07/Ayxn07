<svg xmlns="http://www.w3.org/2000/svg" width="420" height="260" viewBox="0 0 420 260" role="img" aria-label="SOUNDIFY">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14042e"/><stop offset="1" stop-color="#0d0221"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2a6d"/><stop offset=".5" stop-color="#7700ff"/><stop offset="1" stop-color="#66bcbe"/></linearGradient>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#7700ff" stroke-opacity=".14"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="card"><rect x="1.5" y="1.5" width="417" height="257" rx="14"/></clipPath>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
  .disp{font-family:'Orbitron','Arial Black','Segoe UI Black',Impact,sans-serif;font-weight:900}
  @keyframes run{to{stroke-dashoffset:-1300}}
  .run{animation:run 5s linear infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
  .nudge{animation:nudge 1.4s ease-in-out infinite}
  
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}
  .b0{animation-delay:-0.00s}
  .b1{animation-delay:-0.17s}
  .b2{animation-delay:-0.34s}
  .b3{animation-delay:-0.51s}
  .b4{animation-delay:-0.68s}
  .b5{animation-delay:-0.85s}
  .b6{animation-delay:-1.02s}

  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)"><rect width="420" height="260" fill="url(#bg)"/><rect width="420" height="260" fill="url(#grid)"/></g>
<rect x="1.5" y="1.5" width="417" height="257" rx="14" fill="none" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5"/>
<rect class="run" x="1.5" y="1.5" width="417" height="257" rx="14" fill="none" stroke="#7700ff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="90 1210" filter="url(#glow)"/>

<text class="mono" x="24" y="34" font-size="11" letter-spacing="2" fill="#8b7fb8">PROJECT_02</text>
<g transform="translate(317 20)">
  <rect width="79" height="20" rx="10" fill="#66bcbe" fill-opacity=".12" stroke="#66bcbe" stroke-opacity=".6"/>
  <circle class="pulse" cx="11" cy="10" r="3.5" fill="#66bcbe"/>
  <text class="mono" x="21" y="14" font-size="10.5" letter-spacing="1" fill="#66bcbe">FLUTTER</text>
</g>

<text class="disp" x="24" y="86" font-size="30" letter-spacing="2" fill="#7700ff" opacity=".6" filter="url(#blur)">SOUNDIFY</text>
<text class="disp" x="24" y="86" font-size="30" letter-spacing="2" fill="#fff">SOUNDIFY</text>
<rect x="24" y="98" width="44" height="3" rx="1.5" fill="#7700ff"/><rect x="72" y="98" width="10" height="3" rx="1.5" fill="#66bcbe"/>

<text class="mono" x="24" y="128" font-size="13" fill="#e0d7ff">Spotify-style music streaming app in</text><text class="mono" x="24" y="148" font-size="13" fill="#e0d7ff">Flutter - BLoC state management, clean</text><text class="mono" x="24" y="168" font-size="13" fill="#e0d7ff">UI and a scalable reactive architecture.</text>
<g transform="translate(24 190)"><rect width="65" height="22" rx="5" fill="#7700ff" fill-opacity=".1" stroke="#7700ff" stroke-opacity=".55"/><text class="mono" x="32.5" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">Flutter</text></g><g transform="translate(97 190)"><rect width="45" height="22" rx="5" fill="#7700ff" fill-opacity=".1" stroke="#7700ff" stroke-opacity=".55"/><text class="mono" x="22.5" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">Dart</text></g><g transform="translate(150 190)"><rect width="45" height="22" rx="5" fill="#7700ff" fill-opacity=".1" stroke="#7700ff" stroke-opacity=".55"/><text class="mono" x="22.5" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">BLoC</text></g><g transform="translate(203 190)"><rect width="113" height="22" rx="5" fill="#7700ff" fill-opacity=".1" stroke="#7700ff" stroke-opacity=".55"/><text class="mono" x="56.5" y="15" text-anchor="middle" font-size="11" fill="#e0d7ff">Cross-platform</text></g>
<g class="nudge"><text class="mono" x="24" y="240" font-size="12" fill="#66bcbe">&gt;&gt; github.com/ayxn07/soundify</text></g>

<defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#66bcbe"/><stop offset="1" stop-color="#ff2a6d"/></linearGradient></defs>
<g transform="translate(326 46)"><rect class="bar b0" x="0" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b1" x="10" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b2" x="20" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b3" x="30" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b4" x="40" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b5" x="50" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/><rect class="bar b6" x="60" y="0" width="6" height="56" rx="2" fill="url(#eqg)"/></g>
</svg>
