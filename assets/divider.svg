<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img" aria-label="divider">
<defs>
  <linearGradient id="l" x1="0" x2="1">
    <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/><stop offset=".3" stop-color="#ff2a6d"/><stop offset=".7" stop-color="#66bcbe"/><stop offset="1" stop-color="#66bcbe" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="p" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  @keyframes sweep{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}
  .sweep{animation:sweep 3.5s cubic-bezier(.6,0,.4,1) infinite}
  @keyframes spin{to{transform:rotate(405deg)}}
  .gem{transform-box:fill-box;transform-origin:center;transform:rotate(45deg);animation:spin 6s linear infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect y="17" width="1200" height="2" fill="url(#l)"/>
<rect class="sweep" y="16" width="160" height="4" fill="url(#p)" filter="url(#glow)"/>
<rect x="556" y="12" width="2" height="12" fill="#ff2a6d"/><rect x="642" y="12" width="2" height="12" fill="#66bcbe"/>
<rect class="gem" x="593" y="11" width="14" height="14" fill="#0d0221" stroke="#66bcbe" stroke-width="2"/>
</svg>
