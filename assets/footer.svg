<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="end of transmission">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".1"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="ff"><rect y="40" width="1200" height="160" fill="url(#fade)"/></mask>
  <clipPath id="below"><rect y="40" width="1200" height="160"/></clipPath>
  <filter id="glow" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,Menlo,monospace}
  @keyframes floor{from{transform:translateY(0)}to{transform:translateY(24px)}}
  .floor{animation:floor 1.1s linear infinite}
  @keyframes blink{50%{opacity:0}}
  .cursor{animation:blink 1s steps(1) infinite}
  @keyframes flick{0%,30%,34%,100%{opacity:1}32%{opacity:.3}}
  .flick{animation:flick 4s infinite}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="200" fill="#0d0221"/>
